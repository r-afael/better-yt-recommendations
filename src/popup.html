<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better YT Recommendations</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Better YT Recommendations</h1>
  <form id="settings">
    <label class="setting">
      <span>
        <span class="title" id="enabled-title" data-i18n="autoOpen"></span>
        <span class="hint" id="enabled-hint" data-i18n="autoOpenHint"></span>
      </span>
      <input type="checkbox" class="switch" name="enabled" aria-labelledby="enabled-title" aria-describedby="enabled-hint">
    </label>
    <label class="setting">
      <span>
        <span class="title" id="enforce-title" data-i18n="enforce"></span>
        <span class="hint" id="enforce-hint" data-i18n="enforceHint"></span>
      </span>
      <input type="checkbox" class="switch" name="enforce" aria-labelledby="enforce-title" aria-describedby="enforce-hint">
    </label>
    <label class="setting">
      <span>
        <span class="title" id="hideShorts-title" data-i18n="hideShorts"></span>
        <span class="hint" id="hideShorts-hint" data-i18n="hideShortsHint"></span>
      </span>
      <input type="checkbox" class="switch" name="hideShorts" aria-labelledby="hideShorts-title" aria-describedby="hideShorts-hint">
    </label>
    <label class="setting">
      <span>
        <span class="title" id="topicFilter-title" data-i18n="topicFilter"></span>
        <span class="hint" id="topicFilter-hint" data-i18n="topicFilterHint"></span>
      </span>
      <input type="checkbox" class="switch" name="topicFilter" aria-labelledby="topicFilter-title" aria-describedby="topicFilter-hint">
    </label>
    <div class="field">
      <label class="title" for="topics" data-i18n="topics"></label>
      <textarea id="topics" name="topics" rows="3" maxlength="500" data-i18n-placeholder="topicsPlaceholder" aria-describedby="topics-hint"></textarea>
      <span class="hint" id="topics-hint" data-i18n="topicsHint"></span>
      <span class="range-label">
        <label class="title" for="threshold" data-i18n="sensitivity"></label>
        <output id="threshold-value" for="threshold"></output>
      </span>
      <input type="range" id="threshold" name="threshold" min="0.1" max="0.4" step="0.01" aria-describedby="threshold-hint">
      <span class="hint" id="threshold-hint" data-i18n="sensitivityHint"></span>
      <p class="status" id="model-status" role="status" aria-live="polite" hidden></p>
      <progress id="model-progress" max="100" aria-labelledby="model-status" hidden></progress>
    </div>
  </form>
  <footer>
    <a href="https://github.com/r-afael/better-yt-recommendations" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a>
  </footer>
  <script src="settings.js"></script>
  <script src="protocol.js"></script>
  <script src="topics.js"></script>
  <script src="popup.js"></script>
</body>
</html>
