<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better YT Recommendations</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>Better YT Recommendations</h1>
    <button type="button" id="open-options-icon" class="icon-button" data-i18n-aria-label="allSettings" data-i18n-title="allSettings">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" fill-rule="evenodd" d="M16.38 8.29L18.91 8.75L18.91 11.25L16.38 11.71L15.72 13.3L17.19 15.42L15.42 17.19L13.3 15.72L11.71 16.38L11.25 18.91L8.75 18.91L8.29 16.38L6.7 15.72L4.58 17.19L2.81 15.42L4.28 13.3L3.62 11.71L1.09 11.25L1.09 8.75L3.62 8.29L4.28 6.7L2.81 4.58L4.58 2.81L6.7 4.28L8.29 3.62L8.75 1.09L11.25 1.09L11.71 3.62L13.3 4.28L15.42 2.81L17.19 4.58L15.72 6.7ZM13 10a3 3 0 1 0 -6 0a3 3 0 1 0 6 0Z"/></svg>
    </button>
  </header>
  <form id="settings">
    <div id="feed-switches"></div>
    <label class="setting">
      <span>
        <span class="title" id="topicFilter-title" data-i18n="topicFilter">Filter recommendations</span>
        <span class="hint" id="topicFilter-hint" data-i18n="topicFilterHint"></span>
      </span>
      <input type="checkbox" class="switch" name="topicFilter" aria-labelledby="topicFilter-title" aria-describedby="topicFilter-hint">
    </label>
    <div class="field summary-field">
      <div class="profile-row" id="profile-row" hidden>
        <label class="title" for="profile" data-i18n="profile">Profile</label>
        <select id="profile" name="activeProfile">
          <option value="" data-i18n="noProfile"></option>
        </select>
      </div>
      <button type="button" id="summary" class="summary" aria-describedby="open-options"><span id="summary-topics"></span><span id="summary-avoid" hidden></span></button>
      <p class="status" id="model-status" tabindex="-1" role="status" aria-live="polite" hidden></p>
      <progress id="model-progress" max="100" aria-labelledby="model-status" hidden></progress>
      <button type="button" id="load-now" class="secondary" data-i18n="loadNow" hidden></button>
    </div>
  </form>
  <footer>
    <button type="button" id="open-options" class="link" data-i18n="allSettings"></button>
    <a href="https://github.com/r-afael/better-yt-recommendations" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a>
  </footer>
  <script src="settings.js"></script>
  <script src="protocol.js"></script>
  <script src="topics.js"></script>
  <script src="verdict.js"></script>
  <script src="profiles.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
