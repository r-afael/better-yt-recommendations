<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better YT Recommendations</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Better YT Recommendations</h1>
    <form id="settings">
      <section aria-labelledby="topics-section">
        <h2 id="topics-section" data-i18n="topicsSection"></h2>
        <label class="setting">
          <span>
            <span class="title" id="topicFilter-title" data-i18n="topicFilter"></span>
            <span class="hint" id="topicFilter-hint" data-i18n="topicFilterHint"></span>
          </span>
          <input type="checkbox" class="switch" name="topicFilter" aria-labelledby="topicFilter-title" aria-describedby="topicFilter-hint">
        </label>
        <div class="field">
          <label class="title" for="topics" data-i18n="topics"></label>
          <textarea id="topics" name="topics" rows="3" data-i18n-placeholder="topicsPlaceholder" aria-describedby="topics-hint"></textarea>
          <span class="hint" id="topics-hint" data-i18n="topicsHint"></span>
          <label class="title" for="avoidTopics" data-i18n="avoidTopics"></label>
          <textarea id="avoidTopics" name="avoidTopics" rows="3" data-i18n-placeholder="avoidTopicsPlaceholder" aria-describedby="avoidTopics-hint"></textarea>
          <span class="hint" id="avoidTopics-hint" data-i18n="avoidTopicsHint"></span>
          <span class="range-label">
            <label class="title" for="threshold" data-i18n="sensitivity"></label>
            <output id="threshold-value" for="threshold"></output>
          </span>
          <input type="range" id="threshold" name="threshold" step="0.01" aria-describedby="threshold-hint">
          <span class="hint" id="threshold-hint"></span>
          <div class="try">
            <label class="title" for="try-title" data-i18n="tryTitle"></label>
            <input id="try-title" type="text" data-i18n-placeholder="tryTitlePlaceholder" aria-describedby="try-hint">
            <span class="hint" id="try-hint" data-i18n="tryTitleHint"></span>
            <p id="try-result" role="status" aria-live="polite">
              <span id="try-verdict" class="verdict"></span> <span id="try-scores"></span>
            </p>
          </div>
          <p class="status" id="model-status" role="status" aria-live="polite" hidden></p>
          <progress id="model-progress" max="100" aria-labelledby="model-status" hidden></progress>
          <button type="button" id="load-now" class="secondary" data-i18n="loadNow" hidden></button>
        </div>
      </section>
      <section aria-labelledby="pages-section">
        <h2 id="pages-section" data-i18n="filterPages"></h2>
        <label class="setting">
          <span class="title" id="filterWatch-title" data-i18n="filterWatch"></span>
          <input type="checkbox" class="switch" name="filterWatch" aria-labelledby="filterWatch-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterHome-title" data-i18n="filterHome"></span>
          <input type="checkbox" class="switch" name="filterHome" aria-labelledby="filterHome-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterSubscriptions-title" data-i18n="filterSubscriptions"></span>
          <input type="checkbox" class="switch" name="filterSubscriptions" aria-labelledby="filterSubscriptions-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterSearch-title" data-i18n="filterSearch"></span>
          <input type="checkbox" class="switch" name="filterSearch" aria-labelledby="filterSearch-title" aria-describedby="filterPages-hint">
        </label>
        <p class="hint" id="filterPages-hint" data-i18n="filterPagesHint"></p>
      </section>
    </form>
  </main>
  <footer>
    <a href="https://github.com/r-afael/better-yt-recommendations" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a>
  </footer>
  <script src="settings.js"></script>
  <script src="protocol.js"></script>
  <script src="topics.js"></script>
  <script src="verdict.js"></script>
  <script src="ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
