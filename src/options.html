<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better YT Recommendations</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Better YT Recommendations</h1>
    <form id="settings">
      <section aria-labelledby="home-section">
        <h2 id="home-section" data-i18n="homeSection">Home and Shorts</h2>
        <div id="feed-switches"></div>
      </section>
      <section aria-labelledby="topics-section">
        <h2 id="topics-section" data-i18n="topicsSection">Topics</h2>
        <label class="setting">
          <span>
            <span class="title" id="topicFilter-title" data-i18n="topicFilter">Filter recommendations</span>
            <span class="hint" id="topicFilter-hint" data-i18n="topicFilterHintHere"></span>
          </span>
          <input type="checkbox" class="switch" name="topicFilter" aria-labelledby="topicFilter-title" aria-describedby="topicFilter-hint">
        </label>
        <div class="field">
          <label class="title" for="topics" data-i18n="topics">Topics you want to see</label>
          <textarea id="topics" name="topics" rows="3" data-i18n-placeholder="topicsPlaceholder" aria-describedby="topics-hint"></textarea>
          <span class="hint" id="topics-hint" data-i18n="topicsHint"></span>
          <span class="range-label">
            <label class="title" for="threshold" data-i18n="threshold">Match needed to show</label>
            <output id="threshold-value" for="threshold" aria-hidden="true"></output>
          </span>
          <input type="range" id="threshold" name="threshold" step="0.01" aria-describedby="threshold-hint">
          <span class="hint" id="threshold-hint"></span>
          <label class="title list-start" for="avoidTopics" data-i18n="avoidTopics">Topics to avoid</label>
          <textarea id="avoidTopics" name="avoidTopics" rows="3" data-i18n-placeholder="avoidTopicsPlaceholder" aria-describedby="avoidTopics-hint"></textarea>
          <span class="hint" id="avoidTopics-hint" data-i18n="avoidTopicsHint"></span>
          <span class="range-label">
            <label class="title" for="avoidThreshold" data-i18n="avoidThreshold">Match that hides</label>
            <output id="avoidThreshold-value" for="avoidThreshold" aria-hidden="true"></output>
          </span>
          <input type="range" id="avoidThreshold" name="avoidThreshold" step="0.01" aria-describedby="avoidThreshold-hint">
          <span class="hint" id="avoidThreshold-hint"></span>
          <div class="try">
            <label class="title" for="try-title" data-i18n="tryTitle">Try a title</label>
            <input id="try-title" type="text" data-i18n-placeholder="tryTitlePlaceholder" aria-describedby="try-hint">
            <span class="hint" id="try-hint" data-i18n="tryTitleHint"></span>
            <p id="try-result">
              <span id="try-verdict" class="verdict"></span>
              <span role="status" aria-live="polite"><span id="try-outcome" class="visually-hidden"></span> <span id="try-scores"></span></span>
            </p>
          </div>
          <p class="status" id="model-status" tabindex="-1" role="status" aria-live="polite" hidden></p>
          <progress id="model-progress" max="100" aria-labelledby="model-status" hidden></progress>
          <button type="button" id="load-now" class="secondary" data-i18n="loadNow" hidden></button>
          <p class="error" id="topics-error" role="alert" hidden></p>
        </div>
      </section>
      <section aria-labelledby="profiles-section">
        <h2 id="profiles-section" data-i18n="profilesSection">Profiles</h2>
        <div class="field">
          <label class="title" for="profile" data-i18n="profile">Profile</label>
          <select id="profile" name="activeProfile" disabled aria-describedby="profiles-hint">
            <option value="" data-i18n="noProfile"></option>
          </select>
          <label class="title" for="profile-name" data-i18n="profileName">Profile name</label>
          <input id="profile-name" type="text" data-i18n-placeholder="profileNamePlaceholder" disabled>
          <div class="profile-actions">
            <button type="button" id="save-profile" class="secondary" data-i18n="saveProfile" disabled></button>
            <button type="button" id="rename-profile" class="secondary" data-i18n="renameProfile" disabled></button>
            <button type="button" id="delete-profile" class="secondary" data-i18n="deleteProfile" disabled></button>
          </div>
          <p class="hint" id="profiles-hint" data-i18n="profilesHint"></p>
          <p class="error" id="profiles-error" role="alert" hidden></p>
        </div>
      </section>
      <section aria-labelledby="pages-section">
        <h2 id="pages-section" data-i18n="filterPages">Where to filter</h2>
        <label class="setting">
          <span class="title" id="filterWatch-title" data-i18n="filterWatch">Next to the video you're watching</span>
          <input type="checkbox" class="switch" name="filterWatch" aria-labelledby="filterWatch-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterHome-title" data-i18n="filterHome">Home</span>
          <input type="checkbox" class="switch" name="filterHome" aria-labelledby="filterHome-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterSubscriptions-title" data-i18n="filterSubscriptions">Subscriptions</span>
          <input type="checkbox" class="switch" name="filterSubscriptions" aria-labelledby="filterSubscriptions-title" aria-describedby="filterPages-hint">
        </label>
        <label class="setting">
          <span class="title" id="filterSearch-title" data-i18n="filterSearch">Search results</span>
          <input type="checkbox" class="switch" name="filterSearch" aria-labelledby="filterSearch-title" aria-describedby="filterPages-hint">
        </label>
        <p class="hint" id="filterPages-hint" data-i18n="filterPagesHint"></p>
      </section>
      <section aria-labelledby="channels-section">
        <h2 id="channels-section" data-i18n="channels">Channels</h2>
        <div class="field">
          <label class="title" for="allowedChannels" data-i18n="allowedChannels">Never hide these channels</label>
          <textarea id="allowedChannels" name="allowedChannels" rows="4" disabled aria-describedby="allowedChannels-hint channels-hint channels-menu-hint"></textarea>
          <span class="hint" id="allowedChannels-hint" data-i18n="allowedChannelsHint"></span>
          <label class="title" for="blockedChannels" data-i18n="blockedChannels">Always hide these channels</label>
          <textarea id="blockedChannels" name="blockedChannels" rows="4" disabled aria-describedby="blockedChannels-hint channels-hint channels-menu-hint"></textarea>
          <span class="hint" id="blockedChannels-hint" data-i18n="blockedChannelsHint"></span>
          <p class="hint" id="channels-hint" data-i18n="channelsHint"></p>
          <p class="hint" id="channels-menu-hint" data-i18n="channelsMenuHint"></p>
          <p class="error" id="channels-error" role="alert" hidden></p>
        </div>
      </section>
    </form>
    <section aria-labelledby="shortcuts-section">
      <h2 id="shortcuts-section" data-i18n="shortcuts">Keyboard shortcuts</h2>
      <ul id="shortcut-list" class="shortcuts"></ul>
      <p class="hint" data-i18n="shortcutsHint"></p>
      <button type="button" id="change-shortcuts" class="secondary" data-i18n="changeShortcuts"></button>
    </section>
  </main>
  <footer>
    <a href="https://github.com/r-afael/better-yt-recommendations" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a>
  </footer>
  <script src="settings.js"></script>
  <script src="protocol.js"></script>
  <script src="topics.js"></script>
  <script src="verdict.js"></script>
  <script src="channels.js"></script>
  <script src="profiles.js"></script>
  <script src="ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
