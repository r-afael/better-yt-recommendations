name: Release

# Publishes a GitHub Release with the extension's zip when a version tag like v1.2.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check that the tag matches the extension's version
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in $file."
              exit 1
            fi
          done
      - name: Package the extension
        run: zip -r -X "better-yt-recommendations-$GITHUB_REF_NAME.zip" manifest.json src _locales README.md LICENSE
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "better-yt-recommendations-$GITHUB_REF_NAME.zip"
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
