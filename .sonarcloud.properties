# What SonarQube Cloud's automatic analysis reads, matching the ESLint setup. The extension
# is src and scripts. test is test code: test/fixtures holds YouTube's own markup, captured
# or copied with its repeated ids and nonstandard roles, which the tests must keep to match
# what the extension meets on YouTube. src/vendor is a third-party bundle.
sonar.sources=src,scripts,eslint.config.js
sonar.tests=test
sonar.exclusions=src/vendor/**
